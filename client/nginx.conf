# WebSocket handshakes send "Connection: Upgrade"; every other request keeps
# nginx's normal keepalive "Connection: ". Loaded at http{} scope (this file
# is included via /etc/nginx/conf.d/*.conf), one map for the whole server.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A single prompt can be long; the plugin POSTs it verbatim.
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade (/api/ws) — nginx does not forward these headers by
        # default, and a plain HTTP proxy_pass would 400 the handshake.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA history fallback — every non-asset path renders the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
